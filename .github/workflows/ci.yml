name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        shell: pwsh
        run: |
          $PSVersionTable | Out-String | Write-Host

      - name: Validate catalog
        shell: powershell
        run: .\scripts\validate-catalog.ps1

      - name: Install Pester
        shell: powershell
        run: |
          $ConfirmPreference = 'None'
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck -Confirm:$false -ErrorAction Stop
          Import-Module Pester -MinimumVersion 5.0.0

      - name: Engine tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $r = Invoke-Pester -Path .\tests\pester -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { throw ('Pester failed: ' + $r.FailedCount) }

      - name: Routing tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $r = Invoke-Pester -Path .\tests\routing -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { throw ('Routing failed: ' + $r.FailedCount) }

      - name: CLI contract regression
        shell: powershell
        run: |
          .\scripts\regress.ps1 -SkipUnit
          if ($LASTEXITCODE -ne 0) { throw 'regression failed' }

      - name: Generate checksums
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path checksums | Out-Null
          $root = (Get-Location).Path
          $files = @()
          foreach ($d in @('engine','catalog','playbooks','scripts')) {
            $files += Get-ChildItem -Path $d -Recurse -File -ErrorAction SilentlyContinue
          }
          foreach ($f in @('SKILL.md','playbook-index.md','README.md','VERSION')) {
            if (Test-Path $f) { $files += Get-Item $f }
          }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLower()
            $rel = $f.FullName.Substring($root.Length).TrimStart('\') -replace '\\','/'
            ($h + '  ' + $rel)
          }
          $lines | Sort-Object | Set-Content -LiteralPath checksums\SHA256SUMS -Encoding ascii
          Write-Host ('checksums: ' + $lines.Count + ' files')

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums/SHA256SUMS

  coldstart:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build release package
        shell: powershell
        run: .\scripts\release.ps1

      - name: Cold start from zip
        shell: powershell
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          if (-not $zip) { throw 'no release zip' }
          $dst = Join-Path $env:RUNNER_TEMP 'coldstart'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dst -Force
          $eng = Join-Path $dst 'engine\winmedic.ps1'
          if (-not (Test-Path $eng)) { throw 'engine missing after extract' }
          if (-not (Test-Path (Join-Path $dst 'engine\lib\Remote.ps1'))) { throw 'lib module missing after extract' }
          $env:CDRIVE_HOME = Join-Path $env:RUNNER_TEMP 'coldstart-state'
          & $eng doctor; if ($LASTEXITCODE -ne 0) { throw 'doctor failed' }
          $out = Join-Path $env:RUNNER_TEMP 'p.json'
          & $eng probe --set storage --out $out; if ($LASTEXITCODE -ne 0) { throw 'probe failed' }
          if (-not (Test-Path $out)) { throw 'probe produced no findings' }
          & $eng plan --from $out; if ($LASTEXITCODE -ne 0) { throw 'plan failed' }
          & $eng selftest; if ($LASTEXITCODE -ne 0) { throw 'selftest failed' }
          Write-Host 'cold start OK'
