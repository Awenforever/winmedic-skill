name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog
        shell: powershell
        run: .\scripts\validate-catalog.ps1

      - name: Install Pester
        shell: powershell
        run: |
          $ConfirmPreference = 'None'
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck -Confirm:$false -ErrorAction Stop

  suite:
    runs-on: windows-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        suite: ['Action', 'Apps', 'Backup', 'Boot', 'Consistency', 'Diagnose', 'Guardrails', 'Mail', 'Mcp', 'NetLink', 'Network', 'Origins', 'Plan', 'Printers', 'Profile', 'PurgeConfirm', 'Quarantine', 'Recommendations', 'Recovery', 'Relocation', 'RelocationFacts', 'Remote', 'Report', 'RiskGate', 'Safety', 'Security', 'SelfTest', 'Summary', 'Tools', 'Trend', 'Updates', 'Workloads']
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: |
          $ConfirmPreference = 'None'
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck -Confirm:$false -ErrorAction Stop

      - name: Run ${{ matrix.suite }}
        shell: powershell
        run: |
          $r = Invoke-Pester -Path '.\tests\pester\${{ matrix.suite }}.Tests.ps1' -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) {
            foreach ($f in ($r.Failed | Select-Object -First 5)) {
              $m = ($f.ErrorRecord.Exception.Message -replace "`r?`n", ' ')
              if ($m.Length -gt 180) { $m = $m.Substring(0, 180) }
              Write-Host ("::error title=${{ matrix.suite }}::$($f.ExpandedName) :: $m")
            }
            throw 'suite failed: ${{ matrix.suite }}'
          }

  routing:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        shell: powershell
        run: |
          $ConfirmPreference = 'None'
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck -Confirm:$false -ErrorAction Stop
      - name: Routing tests
        shell: powershell
        run: |
          $r = Invoke-Pester -Path .\tests\routing -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { throw 'routing failed' }

  regress:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: CLI contract regression
        shell: powershell
        run: |
          .\scripts\regress.ps1 -SkipUnit
          if ($LASTEXITCODE -ne 0) { throw 'regression failed' }

  coldstart:
    runs-on: windows-latest
    needs: [validate, regress]
    steps:
      - uses: actions/checkout@v4
      - name: Build release package
        shell: powershell
        run: .\scripts\release.ps1
      - name: Cold start from zip
        shell: powershell
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          if (-not $zip) { throw 'no release zip' }
          $dst = Join-Path $env:RUNNER_TEMP 'coldstart'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dst -Force
          $eng = Join-Path $dst 'engine\winmedic.ps1'
          if (-not (Test-Path $eng)) { throw 'engine missing after extract' }
          if (-not (Test-Path (Join-Path $dst 'engine\lib\Remote.ps1'))) { throw 'lib module missing after extract' }
          $env:CDRIVE_HOME = Join-Path $env:RUNNER_TEMP 'coldstart-state'
          & $eng doctor; if ($LASTEXITCODE -ne 0) { throw 'doctor failed' }
          $out = Join-Path $env:RUNNER_TEMP 'p.json'
          & $eng probe --set storage --out $out; if ($LASTEXITCODE -ne 0) { throw 'probe failed' }
          if (-not (Test-Path $out)) { throw 'probe produced no findings' }
          & $eng plan --from $out; if ($LASTEXITCODE -ne 0) { throw 'plan failed' }
          & $eng selftest; if ($LASTEXITCODE -ne 0) { throw 'selftest failed' }
          Write-Host 'cold start OK'
