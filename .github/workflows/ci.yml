name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        shell: pwsh
        run: |
          $PSVersionTable | Out-String | Write-Host

      - name: Validate catalog
        shell: powershell
        run: .\scripts\validate-catalog.ps1

      - name: Install Pester
        shell: powershell
        run: |
          $ConfirmPreference = 'None'
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck -Confirm:$false -ErrorAction Stop
          Import-Module Pester -MinimumVersion 5.0.0

      - name: Engine tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $r = Invoke-Pester -Path .\tests\pester -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { throw ('Pester failed: ' + $r.FailedCount) }

      - name: Routing tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $r = Invoke-Pester -Path .\tests\routing -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { throw ('Routing failed: ' + $r.FailedCount) }

      - name: Generate checksums
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path checksums | Out-Null
          $root = (Get-Location).Path
          $files = @()
          foreach ($d in @('engine','catalog','playbooks','scripts')) {
            $files += Get-ChildItem -Path $d -Recurse -File -ErrorAction SilentlyContinue
          }
          foreach ($f in @('SKILL.md','playbook-index.md','README.md','VERSION')) {
            if (Test-Path $f) { $files += Get-Item $f }
          }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLower()
            $rel = $f.FullName.Substring($root.Length).TrimStart('\') -replace '\\','/'
            ($h + '  ' + $rel)
          }
          $lines | Sort-Object | Set-Content -LiteralPath checksums\SHA256SUMS -Encoding ascii
          Write-Host ('checksums: ' + $lines.Count + ' files')

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums/SHA256SUMS